name: HapticsLab
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  HapticsLab:
    type: application
    platform: iOS
    sources:
      - HapticsLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tapticlab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic

schemes:
  HapticsLab:
    build:
      targets:
        HapticsLab: all
    run:
      config: Debug
    archive:
      config: Release
